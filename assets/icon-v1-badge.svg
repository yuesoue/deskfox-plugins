<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- DeskFox Plugins · V1: 完整狐脸 + 右上角珊瑚 "+" 角标 -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243353"/>
      <stop offset="100%" stop-color="#172238"/>
    </linearGradient>
    <linearGradient id="face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9DBBE3"/>
      <stop offset="100%" stop-color="#7295C4"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- 狐脸（沿用主品牌坐标，稍下移给角标让位） -->
  <g transform="translate(120, 138) scale(1.32)">
    <path d="M -68,-10 L -36,-72 L -18,-12 Z" fill="#7295C4"/>
    <path d="M -56,-20 L -38,-56 L -28,-22 Z" fill="#FF9A7A"/>
    <path d="M 68,-10 L 36,-72 L 18,-12 Z" fill="#7295C4"/>
    <path d="M 56,-20 L 38,-56 L 28,-22 Z" fill="#FF9A7A"/>
    <path d="M -68,-10 L 68,-10 L 0,68 Z" fill="url(#face)"/>
    <path d="M -22,18 L 22,18 L 0,52 Z" fill="#F4F7FB"/>
    <circle cx="-22" cy="4" r="5" fill="#172238"/>
    <circle cx="22" cy="4" r="5" fill="#172238"/>
  </g>

  <!-- 角标："+" 由珊瑚三角组成（上下两个三角形成竖条 + 左右两个三角形成横条） -->
  <g transform="translate(204, 52)">
    <!-- 圆形底盘（半透明深色，让 + 在浅色背景下也清晰） -->
    <circle cx="0" cy="0" r="30" fill="#172238"/>
    <!-- "+" by 4 triangles meeting at center -->
    <path d="M 0,-18 L 6,-2 L -6,-2 Z" fill="#FF9A7A"/>
    <path d="M 0,18 L -6,2 L 6,2 Z" fill="#FF9A7A"/>
    <path d="M -18,0 L -2,-6 L -2,6 Z" fill="#FF9A7A"/>
    <path d="M 18,0 L 2,6 L 2,-6 Z" fill="#FF9A7A"/>
    <!-- 中心连接小方块（2 个三角） -->
    <path d="M -2,-2 L 2,-2 L 2,2 Z" fill="#FF9A7A"/>
    <path d="M -2,-2 L -2,2 L 2,2 Z" fill="#FF9A7A"/>
  </g>
</svg>
